# source: ON Semi (2N3904, 2N3906, PN2222A, 2N7000, BS170), Nexperia
#   (BC547, BC557), Infineon (IRLZ44N), ST (TIP120) datasheets -
#   pin-function facts transcribed by hand from datasheets; facts are not
#   copyrightable. Never import Fritzing/KiCad/AVR-tester tables
#   (CC-BY-SA/GPL).
#
# CONVENTION: pin 1..3 = left-to-right with the FLAT FACE (TO-92) or the
# LABEL (TO-220) toward you and the legs pointing DOWN. The pin order IS
# the value of these records - the American EBC vs European CBE vs the
# 2N7000/BS170 mirror is exactly the mistake this database exists to catch.

class: TRANSISTOR

- id: 2N3904
  desc: NPN 40V 200mA (EBC)
  subclass: bjt
  package: sip3
  pop: 1
  pins: [E, B, C]

- id: 2N3906
  desc: PNP 40V 200mA (EBC)
  subclass: bjt
  package: sip3
  pop: 2
  pins: [E, B, C]

- id: 2N2222
  desc: NPN 40V 800mA (EBC, TO-92 PN2222A)
  subclass: bjt
  package: sip3
  aliases: [PN2222]
  pop: 3
  # TRAP (onsemi, 2026-08-30): a part marked "P2N2222A" is C-B-E - the
  # exact REVERSE of the PN2222A this record describes. Not aliased here:
  # same name family, opposite legs. The Part-ID tester finds the truth
  pins: [E, B, C]

- id: BC547
  desc: NPN 45V 100mA (CBE - reversed!)
  subclass: bjt
  package: sip3
  aliases: [BC548, BC549]
  pop: 4
  pins: [C, B, E]

- id: BC557
  desc: PNP 45V 100mA (CBE - reversed!)
  subclass: bjt
  package: sip3
  aliases: [BC556, BC558]
  pop: 5
  pins: [C, B, E]

- id: TIP120
  desc: NPN Darlington 60V 5A (BCE, TO-220)
  subclass: bjt
  package: sip3
  pop: 6
  # Darlington signatures (onsemi Fig.1): internal C-E flyback diode
  # conducts E->C; B-E reads ~8k resistive (shunt resistors), turn-on
  # ~1.2-1.4V (two junctions). Tab = collector
  pins: [B, C, E]

- id: 2N7000
  desc: N-MOSFET 60V 200mA (SGD)
  subclass: mosfet
  package: sip3
  pop: 1
  # S-G-D flat-face-forward verified against onsemi NDS7002A/D Rev 11
  # (2026-08-30)
  pins: [S, G, D]

- id: IRLZ44N
  desc: N-MOSFET logic-level 55V 47A (GDS, TO-220)
  subclass: mosfet
  package: sip3
  pop: 2
  pins: [G, D, S]

- id: BS170
  desc: N-MOSFET 60V 500mA (DGS - mirror of 2N7000!)
  subclass: mosfet
  package: sip3
  pop: 3
  # D-G-S verified against onsemi MMBF170/D Rev 9 (2026-08-30) - truly
  # the 2N7000's mirror; the body diode is the only way to tell them apart
  pins: [D, G, S]
