# source: Texas Instruments CD4000B and Nexperia HEF4000B datasheets -
#   pin-function facts transcribed by hand from datasheets; facts are not
#   copyrightable. Never import Fritzing/KiCad/AVR-tester tables
#   (CC-BY-SA/GPL).
#
# 4000-series CMOS logic, DIP-14/16. Supply names follow the CMOS convention
# (VDD/VSS). 4049/4050 have their supply at pins 1/8 - the explicit power:
# declaration silences the corner-power check for them.
#
# 4067 (16-ch mux) and 4514 (4-to-16 decoder) are DIP-24 parts deliberately
# NOT seeded: their pin maps were not confidently known at authoring time.
# Add them from the datasheet when someone actually wants them.

class: LOGIC
subclass: s4000

- id: 4001
  desc: Quad 2-input NOR gate
  package: dip14
  aliases: [CD4001, HEF4001]
  pop: 7
  pins: [1A, 1B, 1Y, 2Y, 2A, 2B, VSS, 3A, 3B, 3Y, 4Y, 4A, 4B, VDD]
  fingerprint: BBBBBB-BBBBBB-
  # NOR, gates 1-3 (A,B->Y) = (1,2->3) (5,6->4) (8,9->10); gate 4
  # untouched (6-input GPIO budget). NOTE the 4000-gate layout differs
  # from the 7402's - the vec IS the separator
  vec_supply: 3v3
  vec: 1=0 2=0 5=0 6=0 8=0 9=0 -> 3=1 4=1 10=1
  vec: 2=1 6=1 9=1 -> 3=0 4=0 10=0
  vec: 1=1 2=0 5=1 6=0 8=1 9=0 -> 3=0 4=0 10=0
  vec: 2=1 6=1 9=1 -> 3=0 4=0 10=0

- id: 4011
  desc: Quad 2-input NAND gate
  package: dip14
  aliases: [CD4011, HEF4011]
  pop: 2
  pins: [1A, 1B, 1Y, 2Y, 2A, 2B, VSS, 3A, 3B, 3Y, 4Y, 4A, 4B, VDD]
  fingerprint: BBBBBB-BBBBBB-
  # NAND, gates 1-3; identical map AND truth table to the 4093 Schmitt -
  # they tie on purpose (hysteresis sweep is the separator,
  # DESIGN_PART_DISAMBIGUATION.md)
  vec_supply: 3v3
  vec: 1=0 2=0 5=0 6=0 8=0 9=0 -> 3=1 4=1 10=1
  vec: 2=1 6=1 9=1 -> 3=1 4=1 10=1
  vec: 1=1 5=1 8=1 -> 3=0 4=0 10=0
  vec: 2=0 6=0 9=0 -> 3=1 4=1 10=1

- id: 4013
  desc: Dual D flip-flop with set/reset
  package: dip14
  aliases: [CD4013, HEF4013]
  pop: 4
  # pins 10/11 were swapped in the first authoring - Nexperia HEF4013B
  # Table 2: 2CP (clock) is pin 11, 2CD (reset) is pin 10 (2026-08-30)
  pins: [1Q, 1Q~, 1CLK, 1RST, 1D, 1SET, VSS, 2SET, 2D, 2RST, 2CLK, 2Q~, 2Q, VDD]
  fingerprint: BBBBBB-BBBBBB-
  # FF1 only: rising-edge CP, SET/RST async active-HIGH (CMOS polarity -
  # opposite the 7474). D and CLK never change in the same step so the
  # capture order is unambiguous
  vec_supply: 3v3
  vec: 3=0 4=1 5=0 6=0 -> 1=0 2=1
  vec: 4=0 -> 1=0 2=1
  vec: 5=1 ->
  vec: 3=1 -> 1=1 2=0
  vec: 3=0 5=0 -> 1=1 2=0
  vec: 3=1 -> 1=0 2=1
  vec: 6=1 -> 1=1 2=0
  vec: 6=0 4=1 -> 1=0 2=1

- id: 4017
  desc: Decade counter with 10 decoded outputs
  package: dip16
  aliases: [CD4017, HEF4017]
  pop: 1
  pins: [Q5, Q1, Q0, Q2, Q6, Q7, Q3, VSS, Q8, Q4, Q9, CO, INH, CLK, RST, VDD]
  fingerprint: BBBBBBB-BBBBBBB-
  # rising-edge CLK (advances while INH low); MR high -> Q0 alone high.
  # CO (Q5-9~) sits high through counts 0-4. INH held high gates a CLK
  # falling edge out (it only counts on INH FALLING with CLK high)
  vec_supply: 3v3
  vec: 14=0 13=0 15=1 -> 3=1 2=0 4=0 12=1
  vec: 15=0 -> 3=1 2=0 4=0
  vec: 14=1 -> 3=0 2=1 4=0 12=1
  vec: 14=0 ->
  vec: 14=1 -> 3=0 2=0 4=1
  vec: 13=1 -> 3=0 2=0 4=1
  vec: 14=0 -> 3=0 2=0 4=1
  vec: 15=1 -> 3=1 2=0 4=0 12=1

- id: 4020
  desc: 14-stage binary ripple counter
  package: dip16
  aliases: [CD4020, HEF4020]
  # pin 9 really is Q1 (the first div-2 stage; Q2/Q3 are the unbonded
  # stages) - Nexperia + TI SCHS030D, 2026-08-30
  pins: [Q12, Q13, Q14, Q6, Q5, Q7, Q4, VSS, Q1, CLK, RST, Q9, Q8, Q10, Q11, VDD]
  fingerprint: BBBBBBB-BBBBBBB-
  # FALLING-edge ripple counter, MR active high. Pin 7 separates it from
  # the 4040 (same CLK/RST/Q1 positions): at count 2 pin 7 stays LOW here
  # (it is Q4, needs 8 edges) where the 4040's pin 7 (Q2) goes HIGH
  vec_supply: 3v3
  vec: 10=1 11=1 -> 9=0 7=0 4=0 1=0
  vec: 11=0 -> 9=0
  vec: 10=0 -> 9=1 7=0
  vec: 10=1 ->
  vec: 10=0 -> 9=0 7=0
  vec: 10=1 ->
  vec: 10=0 -> 9=1 7=0
  vec: 11=1 -> 9=0 7=0 4=0 1=0

- id: 4023
  desc: Triple 3-input NAND gate
  package: dip14
  aliases: [CD4023, HEF4023]
  # map verified against TI SCHS021D terminal diagram (2026-08-30):
  # gates (1,2,8)->9, (3,4,5)->6, (11,12,13)->10
  pins: [1A, 1B, 2A, 2B, 2C, 2Y, VSS, 1C, 1Y, 3Y, 3A, 3B, 3C, VDD]
  fingerprint: BBBBBB-BBBBBB-
  # gates 1+2 fully exercised (6-input budget), gate 3 untouched
  vec_supply: 3v3
  vec: 1=0 2=0 8=0 3=0 4=0 5=0 -> 9=1 6=1
  vec: 1=1 2=1 3=1 4=1 -> 9=1 6=1
  vec: 8=1 5=1 -> 9=0 6=0
  vec: 2=0 4=0 -> 9=1 6=1

- id: 4024
  desc: 7-stage binary ripple counter
  package: dip14
  aliases: [CD4024, HEF4024]
  # NC on 8/10/13 verified - TI SCHS030D states it outright (2026-08-30)
  pins: [CLK, RST, Q7, Q6, Q5, Q4, VSS, NC, Q3, NC, Q2, Q1, NC, VDD]
  fingerprint: BBBBBB-NBNBBN-
  # FALLING-edge, RST active high, Schmitt clock input
  vec_supply: 3v3
  vec: 1=1 2=1 -> 12=0 11=0 9=0
  vec: 2=0 -> 12=0
  vec: 1=0 -> 12=1 11=0
  vec: 1=1 ->
  vec: 1=0 -> 12=0 11=1
  vec: 1=1 ->
  vec: 1=0 -> 12=1 11=1
  vec: 2=1 -> 12=0 11=0 9=0

- id: 4026
  desc: Decade counter with 7-segment display outputs
  package: dip16
  aliases: [CD4026, HEF4026]
  # segment positions verified against TI SCHS031B terminal diagram
  # (2026-08-30): 6=f, 7=g, 9=d, 10=a, 11=e, 12=b, 13=c
  pins: [CLK, INH, DEI, DEO, CO, f, g, VSS, d, a, e, b, c, UCS, RST, VDD]
  fingerprint: BBBBBBB-BBBBBBB-
  # rising-edge Johnson decade + active-HIGH segments, gated by DEI:
  # digit 0 (a,b on; g off) -> 1 -> 2 (a,b,g on); DEI low kills segments
  vec_supply: 3v3
  vec: 1=0 2=0 3=1 15=1 -> 10=1 12=1 7=0
  vec: 15=0 -> 10=1 12=1 7=0
  vec: 1=1 -> 10=0 12=1 7=0
  vec: 1=0 ->
  vec: 1=1 -> 10=1 12=1 7=1
  vec: 3=0 -> 10=0 12=0 7=0
  vec: 15=1 3=1 -> 10=1 12=1 7=0

- id: 4027
  desc: Dual JK flip-flop with set/reset
  package: dip16
  aliases: [CD4027, HEF4027]
  pins: [1Q, 1Q~, 1CLK, 1RST, 1K, 1J, 1SET, VSS, 2SET, 2J, 2K, 2RST, 2CLK, 2Q~, 2Q, VDD]
  fingerprint: BBBBBBB-BBBBBBB-
  # FF1 only: rising-edge, SET/RST async active-HIGH; set, reset, toggle,
  # then both async overrides
  vec_supply: 3v3
  vec: 3=0 4=1 5=0 6=0 7=0 -> 1=0 2=1
  vec: 4=0 -> 1=0 2=1
  vec: 6=1 ->
  vec: 3=1 -> 1=1 2=0
  vec: 3=0 6=0 5=1 ->
  vec: 3=1 -> 1=0 2=1
  vec: 7=1 -> 1=1 2=0
  vec: 7=0 4=1 -> 1=0 2=1

- id: 4028
  desc: BCD to decimal decoder (1-of-10)
  package: dip16
  aliases: [CD4028, HEF4028]
  # input order A@10 D@11 C@12 B@13 verified against Nexperia HEF4028B
  # (2026-08-30) - it really is that scrambled
  pins: [Y4, Y2, Y0, Y7, Y9, Y5, Y6, VSS, Y8, A, D, C, B, Y1, Y3, VDD]
  fingerprint: BBBBBBB-BBBBBBB-
  # active-HIGH 1-of-10 (the 7442 is active-LOW - loud separator);
  # invalid codes 10-15 -> ALL outputs LOW
  vec_supply: 3v3
  vec: 10=0 13=0 12=0 11=0 -> 3=1 14=0 2=0 9=0 5=0
  vec: 10=1 -> 3=0 14=1 2=0
  vec: 10=0 11=1 -> 3=0 14=0 9=1
  vec: 10=1 -> 9=0 5=1
  vec: 13=1 -> 3=0 14=0 2=0 9=0 5=0

- id: 4040
  desc: 12-stage binary ripple counter
  package: dip16
  aliases: [CD4040, HEF4040]
  pop: 9
  pins: [Q12, Q6, Q5, Q7, Q4, Q3, Q2, VSS, Q1, CLK, RST, Q9, Q8, Q10, Q11, VDD]
  fingerprint: BBBBBBB-BBBBBBB-
  # FALLING-edge, MR active high. Pin 7 (Q2) goes high at count 2 - the
  # 4020 (whose pin 7 is Q4) stays low there. See the 4020 note
  vec_supply: 3v3
  vec: 10=1 11=1 -> 9=0 7=0 6=0 5=0
  vec: 11=0 -> 9=0
  vec: 10=0 -> 9=1 7=0
  vec: 10=1 ->
  vec: 10=0 -> 9=0 7=1
  vec: 10=1 ->
  vec: 10=0 -> 9=1 7=1
  vec: 11=1 -> 9=0 7=0 6=0 5=0

- id: 4046
  desc: Phase-locked loop with VCO
  package: dip16
  aliases: [CD4046, HEF4046]
  pop: 11
  pins: [PP, PC1, CIN, VCOOUT, INH, C1A, C1B, VSS, VCOIN, SF, R1, R2, PC2, SIG, ZEN, VDD]
  # No vec on purpose: the VCO needs external R/C to run and every useful
  # output is an oscillation or an analog level - invisible to static
  # steps. Fingerprint only; the analog pins stay '?'
  fingerprint: BB?BB??-????B??-

- id: 4049
  desc: Hex inverting buffer (level-down capable)
  package: dip16
  aliases: [CD4049, HEF4049]
  power: VDD@1 VSS@8
  pins: [VDD, 1Y, 1A, 2Y, 2A, 3Y, 3A, VSS, 4A, 4Y, 5A, 5Y, NC, 6A, 6Y, NC]
  # The level-shifter fingerprint: inputs tolerate 15V because they have
  # NO diode to VDD - series R + clamp to VSS only (Nexperia HEF4049B
  # Fig.3, TI SCHS046L, 2026-08-30). Inputs read G, outputs B - unique
  # among the 4000s and shared only with the 4050
  fingerprint: -BGBGBG-GBGBNGBN
  # inverting: (3->2) (5->4) (7->6)
  vec_supply: 3v3
  vec: 3=0 5=0 7=0 -> 2=1 4=1 6=1
  vec: 3=1 5=1 7=1 -> 2=0 4=0 6=0

- id: 4050
  desc: Hex non-inverting buffer (level-down capable)
  package: dip16
  aliases: [CD4050, HEF4050]
  power: VDD@1 VSS@8
  pins: [VDD, 1Y, 1A, 2Y, 2A, 3Y, 3A, VSS, 4A, 4Y, 5A, 5Y, NC, 6A, 6Y, NC]
  # same VSS-only input protection as the 4049 (see its note)
  fingerprint: -BGBGBG-GBGBNGBN
  # non-inverting: (3->2) (5->4) (7->6) - the 4049's mirror image verdict
  vec_supply: 3v3
  vec: 3=0 5=0 7=0 -> 2=0 4=0 6=0
  vec: 3=1 5=1 7=1 -> 2=1 4=1 6=1

- id: 4051
  desc: 8-channel analog multiplexer/demultiplexer
  package: dip16
  aliases: [CD4051, HEF4051, 74HC4051]
  pop: 5
  pins: [CH4, CH6, COM, CH7, CH5, INH, VEE, VSS, C, B, A, CH3, CH0, CH1, CH2, VDD]
  # analog pins clamp to VDD and to VEE - with VEE floating unpowered they
  # read V, with VEE strapped they read B: 'C' covers both. VEE itself '?'
  fingerprint: CCCCCB?-BBBCCCC-
  # VEE (7) is DRIVEN low - the GPIO low IS the single-supply VEE=VSS
  # strap (Nexperia specs "VSS = VEE = 0V"). Select 000 -> CH0(13)
  # follows through to COM(3); deselect -> pull-up H; INH=1 -> all off
  vec_supply: 3v3
  vec: 7=0 6=0 9=0 10=0 11=0 13=0 -> 3=0
  vec: 13=1 -> 3=1
  vec: 13=0 11=1 -> 3=1
  vec: 11=0 -> 3=0
  vec: 6=1 -> 3=1

- id: 4052
  desc: Dual 4-channel analog multiplexer/demultiplexer
  package: dip16
  aliases: [CD4052, HEF4052, 74HC4052]
  # X/Y halves verified against TI SCHS047O Table 4-2 (2026-08-30):
  # Y on pins 1-5, X on 11-15, exactly as listed
  pins: [Y0, Y2, YCOM, Y3, Y1, INH, VEE, VSS, B, A, X3, X0, XCOM, X1, X2, VDD]
  fingerprint: CCCCCB?-BBCCCCC-
  # VEE driven low (see the 4051 note). X0(12) -> XCOM(13) at select 00
  vec_supply: 3v3
  vec: 7=0 6=0 9=0 10=0 12=0 -> 13=0
  vec: 12=1 -> 13=1
  vec: 12=0 10=1 -> 13=1
  vec: 10=0 -> 13=0
  vec: 6=1 -> 13=1

- id: 4053
  desc: Triple 2-channel analog multiplexer/demultiplexer
  package: dip16
  aliases: [CD4053, HEF4053, 74HC4053]
  # pins 4/5 were swapped in the first authoring - TI SCHS047O Table 4-3
  # and Nexperia both put the C-switch COMMON on 4 and CX on 5; pins
  # 12-15 (AX/AY/ACOM/BCOM) verified correct (2026-08-30)
  pins: [BY, BX, CY, CCOM, CX, INH, VEE, VSS, C, B, A, AX, AY, ACOM, BCOM, VDD]
  fingerprint: CCCCCB?-BBBCCCC-
  # VEE driven low (see the 4051 note). Switch A: select low -> AX(12),
  # high -> AY(13), onto ACOM(14); INH=1 -> everything off
  vec_supply: 3v3
  vec: 7=0 6=0 11=0 12=0 13=1 -> 14=0
  vec: 11=1 -> 14=1
  vec: 13=0 -> 14=0
  vec: 6=1 -> 14=1

