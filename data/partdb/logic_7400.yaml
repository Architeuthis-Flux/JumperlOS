  pins: [1OE, 1A1, 2Y4, 1A2, 2Y3, 1A3, 2Y2, 1A4, 2Y1, GND, 2A1, 1Y4, 2A2, 1Y3, 2A3, 1Y2, 2A4, 1Y1, 2OE, VCC]
  fingerprint: CCCCCCCCC-CCCCCCCCC-
  # inverting: 1A1(2)->1Y1(18), 1A2(4)->1Y2(16), 2A1(11)->2Y1(9); each OE
