# source: Texas Instruments SN74xx/SN74HCxx and Nexperia 74HCxx datasheets -
#   pin-function facts transcribed by hand from datasheets; facts are not
#   copyrightable. Never import Fritzing/KiCad/AVR-tester tables
#   (CC-BY-SA/GPL).
#
# 7400-series TTL/CMOS logic, DIP-14/16/20. pins: is positional (entry i =
# physical pin i+1). Corner-power (GND at N/2, VCC at N) is validated for
# dip14/dip16; the 7490 declares power: because its supply really is
# mid-package. Aliases cover the HC/LS/HCT families.

class: LOGIC
subclass: s7400

- id: 7400
  desc: Quad 2-input NAND gate
  package: dip14
  aliases: [74HC00, 74LS00, 74HCT00]
  pop: 1
  pins: [1A, 1B, 1Y, 2A, 2B, 2Y, GND, 3Y, 3A, 3B, 4Y, 4A, 4B, VCC]

