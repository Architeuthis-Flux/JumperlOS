  vec: 2=1 11=1 -> 18=0 16=1 9=0
  vec: 1=1 19=1 -> 18=1 16=1 9=1
  vec: 1=0 19=0 -> 18=0 16=1 9=0

- id: 74245
  desc: Octal bus transceiver, 3-state
  package: dip20
  aliases: [74HC245, 74LS245, 74HCT245]
  pop: 8
  pins: [DIR, A1, A2, A3, A4, A5, A6, A7, A8, GND, B8, B7, B6, B5, B4, B3, B2, B1, OE, VCC]
  fingerprint: CCCCCCCCC-CCCCCCCCC-
  # DIR held HIGH the whole run (A drives B, TI SDLS146B) - NEVER drop it
